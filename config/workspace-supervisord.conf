# =============================================================================
# supervisord — code-server workspace stack
#   code-server :8080   sshd :2222   cron   [optional] code tunnel
# Installed at /etc/supervisor/conf.d/workspace.conf
# =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/mosgarage/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── code-server ───────────────────────────────────────────────────────────────
[program:code-server]
command=/usr/bin/code-server --config /home/mosgarage/.config/code-server/config.yaml
user=mosgarage
; supervisord inherits HOME=/root from the container entrypoint, which makes
; code-server try to write its caches into /root and fail with EACCES.
environment=HOME="/home/mosgarage",USER="mosgarage",XDG_CONFIG_HOME="/home/mosgarage/.config",XDG_DATA_HOME="/home/mosgarage/.local/share",XDG_CACHE_HOME="/home/mosgarage/.cache"
directory=/home/mosgarage/workspace
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stdout_logfile=/var/log/mosgarage/code-server.log
stderr_logfile=/var/log/mosgarage/code-server.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ── SSH server ────────────────────────────────────────────────────────────────
[program:sshd]
command=/usr/sbin/sshd -D -f /etc/ssh/sshd_config -E /var/log/mosgarage/sshd.log
user=root
autostart=true
autorestart=true
priority=5
startsecs=2
startretries=5
stdout_logfile=/var/log/mosgarage/sshd.log
stderr_logfile=/var/log/mosgarage/sshd.log
stdout_logfile_maxbytes=5MB

; ── cron (nightly workspace backup) ──────────────────────────────────────────
[program:cron]
command=/usr/sbin/cron -f
user=root
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/log/mosgarage/cron.log
stderr_logfile=/var/log/mosgarage/cron.err.log

; ── VS Code tunnel (opt-in: set GITHUB_TOKEN and start with mgw) ──────────────
[program:code-tunnel]
command=/usr/local/bin/start-code-tunnel
user=root
autostart=false
autorestart=true
startsecs=5
stdout_logfile=/var/log/mosgarage/code-tunnel.log
stderr_logfile=/var/log/mosgarage/code-tunnel.err.log
